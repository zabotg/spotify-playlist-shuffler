<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-labelledby="title">
<title id="title">Spotify Playlist Shuffler</title>
<defs><linearGradient id="bg"><stop stop-color="#101713"/><stop offset="1" stop-color="#173426"/></linearGradient></defs>
<style>
.track { animation: shuffle 9s ease-in-out infinite; }
@keyframes shuffle {0%,20%,100% {transform:translateY(0)} 32%,52% {transform:translateY(var(--a))} 64%,84% {transform:translateY(var(--b))}}
.bar { transform-box: fill-box; transform-origin: center bottom; animation: pulse var(--period) ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scaleY(.34); } to { transform: scaleY(1); } }
.spectrum .bar { transform-origin: center; }
@media (prefers-reduced-motion: reduce) { .track, .bar {animation:none} }
</style>
<rect width="1000" height="200" rx="16" fill="url(#bg)"/>
<text x="52" y="89" font-family="Arial,sans-serif" font-weight="700" font-size="47" fill="#fff">Spotify Playlist <tspan fill="#1ED760">Shuffler</tspan></text>
