name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values: the app needs them to start, but CI never talks to Spotify.
      SPOTIFY_CLIENT_ID: ci-client-id
      SPOTIFY_CLIENT_SECRET: ci-client-secret
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:3000/api/auth/callback
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      - name: Smoke test the production server
        run: |
          npx next start -H 127.0.0.1 -p 3000 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          npm run test:e2e
